name: Live ISO

# Builds the bootable MWX 7 live ISO, boot-tests it in QEMU and attaches it to a GitHub release.
# Runs when a release bumps the version in package.json on main, on version tags, and by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ['package.json', 'distro/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap squashfs-tools xorriso mtools dosfstools grub-pc-bin qemu-system-x86 ovmf
      - name: Build ISO
        run: sudo -E env "PATH=$PATH" ./distro/build-iso.sh
      - name: Boot test in QEMU
        run: |
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          sudo ./distro/smoke-test.sh 1500
      - name: Publish release
        # distro-only changes rebuild and test the ISO; a new release needs a new version number.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v$V"
          cp distro/out/mwx7-live.iso "mwx7-$V-live.iso"
          sha256sum "mwx7-$V-live.iso" > "mwx7-$V-live.iso.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ "${{ github.event_name }}" = workflow_dispatch ] || { echo "Release $TAG exists; bump the version to publish."; exit 0; }
            gh release upload "$TAG" "mwx7-$V-live.iso" "mwx7-$V-live.iso.sha256" --clobber
          else
            gh release create "$TAG" "mwx7-$V-live.iso" "mwx7-$V-live.iso.sha256" --target "$GITHUB_SHA" \
              --title "MWX 7 $V" --notes-file distro/RELEASE_NOTES.md
          fi

  # The native desktop (roadmap stage 1) as a preview download next to the Classic ISO. Built after the Classic job so
  # the release already exists when it uploads.
  desktop:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap squashfs-tools xorriso mtools dosfstools grub-pc-bin qemu-system-x86 ovmf
      - name: Build desktop ISO
        run: sudo -E env "PATH=$PATH" ./distro/build-iso.sh desktop
      - name: Boot test in QEMU (desktop shell must start)
        run: |
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          sudo FLAVOR=desktop ./distro/smoke-test.sh 1500 uefi bios
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          F="mwx7-$V-desktop-preview.iso"
          cp distro/out/mwx7-desktop-live.iso "$F"
          sha256sum "$F" > "$F.sha256"
          if gh release view "v$V" --json assets --jq '.assets[].name' | grep -qx "$F" && [ "${{ github.event_name }}" != workflow_dispatch ]; then
            echo "$F already attached; bump the version to publish a new one."; exit 0
          fi
          gh release upload "v$V" "$F" "$F.sha256" --clobber
