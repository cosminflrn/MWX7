name: Live ISO

# Builds the bootable MWX 7 ISO, boot-tests it in QEMU and attaches it to a GitHub release.
# Runs by itself when a new version lands on main (the version in package.json changes) or when this file changes;
# also by hand (Actions tab). Installed systems get every change through the update channel (updates.yml); the ISO is
# for new installs. Only the newest version keeps a release: older v* releases and their tags are removed after publishing.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/distro.yml']
  workflow_dispatch:
    inputs:
      free_only:
        description: 'Run only the "free" test (interactive install next to Windows), not the other boot tests'
        type: boolean
        default: false

permissions:
  contents: write


concurrency:
  group: iso
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180  # build ~30 min + 3 boots + the install test (KVM: ~25 min with its boot menu starts; own limit 40)
    steps:
      - name: Free disk space (the build tree, ISO and 24 GB test disk need ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number is the commit count
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build the web apps
        run: npm ci && npx vite build  # build-iso.sh copies dist/ into the image; build-deb.sh ships it as /usr/share/mwx7/web
      - name: Install build tools
        run: |
          # The runner's Ubuntu mirror failed on 11 Nov 2026 (apt exit 100): retry, then fall back to the main archive.
          for i in 1 2 3; do
            sudo apt-get update -qq -o Acquire::Retries=5 &&
              sudo apt-get install -y -qq -o Acquire::Retries=5 debootstrap squashfs-tools xorriso mtools dosfstools \
                grub-pc-bin grub-efi-amd64-bin qemu-system-x86 ovmf ntfs-3g tesseract-ocr imagemagick && break
            sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sleep 30
          done
          command -v debootstrap mksquashfs xorriso qemu-system-x86_64
      - name: Boot menu choices in real GRUB (Windows by default, MWX 7 after its own restarts, the update fallback)
        # A couple of minutes; first, so a broken boot menu fails before the 30-minute build.
        run: ./distro/tests/boot-choice-test.sh
      - name: Build ISO
        run: |
          sudo -E env "PATH=$PATH" ./distro/build-iso.sh > build.log 2>&1 || { tail -50 build.log
            echo "::error::ISO build failed: $(tail -5 build.log | tr '\n' ' ' | tail -c 400)"; exit 1; }
          tail -5 build.log
      - name: Free the build tree (disk space for the test VMs)
        run: |
          sudo rm -rf distro/out/live-root distro/out/iso distro/out/deb node_modules
          df -h /
      - name: Enable KVM
        run: |
          # Hosted runners have /dev/kvm but only root may use it; this rule opens it up for the qemu processes.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::no /dev/kvm, the boot tests run without acceleration (slow)"
      - name: Boot tests in QEMU (BIOS, UEFI, Secure Boot, install + first logon screen, signed-in desktop screenshots)
        if: ${{ !inputs.free_only }}
        run: |
          # Failures are also reported as annotations (readable without the job log).
          sudo env INSTALL_LIMIT=2400 ./distro/smoke-test.sh 600 bios uefi secureboot install session > smoke.log 2>&1 || { cat smoke.log
            echo "::error::Boot test failed: $(tr -d '\r' < smoke.log | grep -av '^\s*$' | tail -90 | tr '\n' '|' | tail -c 9000)"
            for t in bios uefi secureboot install install-boot session; do
              [ -f distro/out/smoke-$t.log ] && echo "::error::serial $t: $(tr -d '\r\0' < distro/out/smoke-$t.log | grep -av '^\s*$' | tail -25 | tr '\n' '|' | tail -c 2500)"
            done; exit 1; }
          cat smoke.log
      - name: Interactive install next to Windows (keyboard-driven setup, free space, nothing existing may change)
        # The real setup, not the autoinstall hook: this is the path a person takes on a PC that already has Windows. Its screenshots
        # (distro/out/free/shots) show every page, including the in-window "Last check".
        run: |
          sudo env FREE_LIMIT=2400 ./distro/smoke-test.sh 600 free > smoke-free.log 2>&1 || { cat smoke-free.log
            echo "::error::Free-space install test failed: $(tr -d '\r' < smoke-free.log | grep -av '^\s*$' | tail -60 | tr '\n' '|' | tail -c 6000)"; exit 1; }
          cat smoke-free.log
      - name: Make the test logs readable for upload
        # The tests run as root; a root-only file once made the upload (and so the whole run) fail.
        if: always()
        run: sudo chmod -R a+rX distro/out 2>/dev/null || true
      - name: Upload serial logs and desktop screenshots
        # Always: the session test's PNGs (desktop, Start menu, Notepad, traffic-light hover) are the way to see the real desktop.
        # Logs are a convenience: an upload problem must never mark a passing run as failed (and email about it).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: smoke-serial-logs
          path: |
            distro/out/smoke-*.log
            distro/out/session/
            distro/out/free/
            smoke.log
            smoke-free.log
            build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Desktop tour summary
        if: always()
        run: |
          [ -f distro/out/session/summary.md ] && cat distro/out/session/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish release
        # Only main and tags publish: test runs on feature branches must never replace a release's ISO.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.MWX7_UPDATES_KEY }}
        run: |
          V="$(node -p "require('./package.json').version").$(git rev-list --count HEAD)"
          TAG="v$(node -p "require('./package.json').version")"; F="mwx7-$V.iso"
          trap 'echo "::error::Publishing failed at line $LINENO"' ERR
          cp distro/out/mwx7.iso "$F"
          sha256sum "$F" > "$F.sha256"
          # Signed with the update channel's key: the recovery copy accepts only a genuine MWX 7 ISO.
          SIG=""
          if [ -n "$KEY" ]; then
            export GNUPGHOME="$(mktemp -d)"
            echo "$KEY" | gpg --batch --import
            gpg --batch --yes --detach-sign -o "$F.sig" "$F"
            SIG="$F.sig"
          fi
          # Reset MWX 7 finds the newest ISO through this small file (releases/latest/download/latest.json).
          printf '{"iso": "%s", "sha256": "%s"}\n' "$F" "$(cut -d' ' -f1 "$F.sha256")" > latest.json
          # GitHub sometimes drops a large upload: publish is retried (an existing release is reused, its ISO replaced).
          trap - ERR
          publish() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              # One ISO per release: a rebuild replaces the previous one.
              for old in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '\.iso(\.sha256|\.sig)?$'); do
                gh release delete-asset "$TAG" "$old" -y || return 1
              done
              gh release upload "$TAG" "$F" "$F.sha256" $SIG latest.json --clobber || return 1
              gh release edit "$TAG" --notes-file distro/RELEASE_NOTES.md || return 1
            else
              gh release create "$TAG" "$F" "$F.sha256" $SIG latest.json --target "$GITHUB_SHA" \
                --title "MWX 7 $V" --notes-file distro/RELEASE_NOTES.md || return 1
            fi
          }
          for try in 1 2 3 4; do
            publish && break
            [ "$try" = 4 ] && { echo "::error::Publishing failed 4 times"; exit 1; }
            echo "::warning::publish attempt $try failed, retrying in 60 s"; sleep 60
          done
          # Keep only this version's release (plus the "updates" channel release, which is not a v* tag).
          for old in $(gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E '^v[0-9]' | grep -vx "$TAG"); do
            gh release delete "$old" -y --cleanup-tag || echo "::warning::could not remove $old"
          done
          for old in $(git ls-remote --tags origin 'refs/tags/v*' | sed 's#.*refs/tags/##' | grep -v '\^{}$' | grep -vx "$TAG"); do
            git push origin --delete "refs/tags/$old" || echo "::warning::could not remove tag $old"
          done
