name: Live ISO

# Builds the bootable MWX 7 ISO, boot-tests it in QEMU and attaches it to a GitHub release.
# Only by hand (Actions tab), for a version tag, or by pushing to the "iso" branch: installed systems get changes
# through the update channel (updates.yml), so a new ISO is only needed for new installs.
on:
  push:
    branches: [iso]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180  # build ~30 min + 3 boots + the install test (KVM: ~15 min; the install test's own limit is 40)
    steps:
      - name: Free disk space (the build tree, ISO and 24 GB test disk need ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number is the commit count
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build the web apps
        run: npm ci && npx vite build  # build-iso.sh copies dist/ into the image; build-deb.sh ships it as /usr/share/mwx7/web
      - name: Install build tools
        run: |
          # The runner's Ubuntu mirror failed on 11 Nov 2026 (apt exit 100): retry, then fall back to the main archive.
          for i in 1 2 3; do
            sudo apt-get update -qq -o Acquire::Retries=3 &&
              sudo apt-get install -y -qq -o Acquire::Retries=3 debootstrap squashfs-tools xorriso mtools dosfstools \
                grub-pc-bin qemu-system-x86 ovmf && break
            sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sleep 30
          done
          command -v debootstrap mksquashfs xorriso qemu-system-x86_64
      - name: Build ISO
        run: |
          sudo -E env "PATH=$PATH" ./distro/build-iso.sh > build.log 2>&1 || { tail -50 build.log
            echo "::error::ISO build failed: $(tail -5 build.log | tr '\n' ' ' | tail -c 400)"; exit 1; }
          tail -5 build.log
      - name: Free the build tree (disk space for the test VMs)
        run: |
          sudo rm -rf distro/out/live-root distro/out/iso distro/out/deb node_modules
          df -h /
      - name: Enable KVM
        run: |
          # Hosted runners have /dev/kvm but only root may use it; this rule opens it up for the qemu processes.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::no /dev/kvm, the boot tests run without acceleration (slow)"
      - name: Boot tests in QEMU (BIOS, UEFI, Secure Boot, install + first logon screen, signed-in desktop screenshots)
        run: |
          # Failures are also reported as annotations (readable without the job log).
          sudo env INSTALL_LIMIT=2400 ./distro/smoke-test.sh 600 bios uefi secureboot install session > smoke.log 2>&1 || { cat smoke.log
            echo "::error::Boot test failed: $(tr -d '\r' < smoke.log | grep -av '^\s*$' | tail -90 | tr '\n' '|' | tail -c 9000)"
            for t in bios uefi secureboot install install-boot session; do
              [ -f distro/out/smoke-$t.log ] && echo "::error::serial $t: $(tr -d '\r\0' < distro/out/smoke-$t.log | grep -av '^\s*$' | tail -25 | tr '\n' '|' | tail -c 2500)"
            done; exit 1; }
          cat smoke.log
      - name: Upload serial logs and desktop screenshots
        # Always: the session test's PNGs (desktop, Start menu, Notepad, traffic-light hover) are the way to see the real desktop.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-serial-logs
          path: |
            distro/out/smoke-*.log
            distro/out/session/
            smoke.log
            build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.MWX7_UPDATES_KEY }}
        run: |
          V="$(node -p "require('./package.json').version").$(git rev-list --count HEAD)"
          TAG="v$(node -p "require('./package.json').version")"; F="mwx7-$V.iso"
          trap 'echo "::error::Publishing failed at line $LINENO"' ERR
          cp distro/out/mwx7.iso "$F"
          sha256sum "$F" > "$F.sha256"
          # Signed with the update channel's key: the recovery copy accepts only a genuine MWX 7 ISO.
          SIG=""
          if [ -n "$KEY" ]; then
            export GNUPGHOME="$(mktemp -d)"
            echo "$KEY" | gpg --batch --import
            gpg --batch --yes --detach-sign -o "$F.sig" "$F"
            SIG="$F.sig"
          fi
          # Reset MWX 7 finds the newest ISO through this small file (releases/latest/download/latest.json).
          printf '{"iso": "%s", "sha256": "%s"}\n' "$F" "$(cut -d' ' -f1 "$F.sha256")" > latest.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            # One ISO per release: a rebuild replaces the previous one.
            for old in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '\.iso(\.sha256|\.sig)?$'); do
              gh release delete-asset "$TAG" "$old" -y
            done
            gh release upload "$TAG" "$F" "$F.sha256" $SIG latest.json --clobber
            gh release edit "$TAG" --notes-file distro/RELEASE_NOTES.md
          else
            gh release create "$TAG" "$F" "$F.sha256" $SIG latest.json --target "$GITHUB_SHA" \
              --title "MWX 7 $V" --notes-file distro/RELEASE_NOTES.md
          fi
