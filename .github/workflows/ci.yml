name: CI

on:
  pull_request:

# One job: `npm test` builds (typecheck + production build) before the end-to-end checks, so a separate build job only
# added a second chance for GitHub to fail to start a runner (a "No jobs were run" email on 9 Nov 2026).
jobs:
  e2e:
    # Pinned: "ubuntu-latest" is moving to the Ubuntu 26 beta, where the browser test setup fails.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser's system libraries come from the runner's apt sources; if one of those sources is down (11 Nov 2026
      # every run stopped there), the libraries already on the runner usually suffice, so carry on and let the tests
      # decide.
      - run: npx playwright install-deps chromium || echo "::warning::Installing browser libraries failed; trying without"
      - run: npx playwright install chromium
      - run: npm test
