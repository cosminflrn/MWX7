name: Keep only main

# The repo has one branch, main: every other branch is deleted, and so are leftover archive/* tags.
# Runs when this file changes, every Monday, and by hand (Actions tab).
on:
  push:
    branches: [main]
    paths: ['.github/workflows/keep-only-main.yml']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Delete every branch except main
        run: |
          for ref in $(git ls-remote --heads origin | sed 's#.*refs/heads/##' | grep -vx main); do
            git push origin --delete "refs/heads/$ref" && echo "deleted branch $ref" || echo "::warning::could not delete $ref"
          done
          for tag in $(git ls-remote --tags origin 'refs/tags/archive/*' | sed 's#.*refs/tags/##' | grep -v '\^{}$'); do
            git push origin --delete "refs/tags/$tag" && echo "deleted tag $tag" || echo "::warning::could not delete $tag"
          done
