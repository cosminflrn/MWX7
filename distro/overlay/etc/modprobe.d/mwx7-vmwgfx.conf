# vmwgfx is only for VMware and VirtualBox (VMSVGA). Elsewhere (QEMU's vmware-svga model) it claims the screen from the
# simpledrm fallback and then refuses the adapter, leaving no display at all. Load it only where it belongs.
install vmwgfx case "$(systemd-detect-virt 2>/dev/null)" in vmware|oracle) /sbin/modprobe --ignore-install vmwgfx $CMDLINE_OPTS ;; *) true ;; esac
