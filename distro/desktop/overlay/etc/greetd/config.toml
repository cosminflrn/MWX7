# The live system logs straight in as the "mwx" user (no password on a live medium). The installer rewrites this file:
# an installed system starts at the MWX 7 logon screen (default_session) unless the person chose automatic logon.
[terminal]
vt = 1

[initial_session]
command = "/usr/local/bin/mwx7-session"
user = "mwx"

[default_session]
command = "/usr/local/bin/mwx7-greeter-session"
user = "_greetd"
