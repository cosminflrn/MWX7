<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- MWX 7: crisp text on ordinary (non-HiDPI) monitors. Light hinting keeps letter shapes true while snapping stems to
     pixels, and greyscale antialiasing avoids the coloured fringes subpixel rendering shows on some panels and in VMs.
     Selawik is the interface font; sans-serif and system-ui point to it so apps that ask generically match MWX 7.
     Numbered 56 so it comes before the DejaVu packages (57-*), which otherwise claim sans-serif first. -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
  <alias binding="same"><family>system-ui</family><prefer><family>Selawik</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Selawik</family><family>Noto Sans</family><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
