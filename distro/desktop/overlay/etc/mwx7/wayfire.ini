# MWX 7 desktop: Wayfire configuration.
# Keyboard: on a real OS the usual shortcuts belong (Alt+Tab, Alt+F4); MWX 7 on the web avoided them only because the
# host OS owns them there.

[core]
plugins = alpha mwx7-animate autostart blur command mwx7-decor fast-switcher foreign-toplevel grid gtk-shell ipc ipc-rules move place resize scale session-lock switcher vswitch window-rules wm-actions wayfire-shell xdg-activation
# Server-side frames for every app that allows it, so all windows share the MWX 7 frame.
preferred_decoration_mode = server
xwayland = true
vwidth = 1
vheight = 1
background_color = 0.05 0.12 0.25 1.0
close_top_view = <alt> KEY_F4

[input]
xkb_layout = us,ro
xkb_variant = ,std
xkb_options = grp:win_space_toggle
cursor_theme = Adwaita
cursor_size = 24

[decoration]
# Family only: Wayfire sizes the title text from title_height.
font = Selawik
title_height = 26
border_size = 7
# Green, yellow, red on the right, as on MWX 7 on the web (drawn by our mwx7-decor plugin).
button_order = minimize maximize close
# Aero glass: Sky blue at intensity 0 (nearly clear glass over the blur), as MWX 7 on the web. '#' starts a comment
# in this format, hence \#. Settings -> Personalize changes both.
active_color = \#1E64DC14
inactive_color = \#1E64DC14

[blur]
# Aero glass: blur whatever is behind translucent windows, frames and the shell.
# Only the shell and app windows: blurring the wallpaper's own layer drops parts of it on repaint (navy holes).
blur_by_default = app_id is "mwx7-bar" | app_id is "mwx7-dock" | app_id is "notifications" | type is "toplevel"
method = kawase
# Two passes with a wider offset look the same as three but cost a third less on every repaint (dragging a window
# repaints the blur behind it each frame; in VMs that was the lag).
kawase_offset = 3.5
kawase_degrade = 3
kawase_iterations = 2
saturation = 1.15

[animate]
open_animation = zoom
close_animation = fade
duration = 220ms
startup_duration = 400ms

[zoom]
# Settings -> Ease of Access -> Magnifier adds the zoom plugin: Super + scroll wheel zooms the whole screen.
modifier = <super>
speed = 0.02

[mwx7-animate]
# Settings -> Display -> Animations: full, reduced (short fades only) or off. mwx7-perf picks reduced in VMware.
level = full

[switcher]
# Alt+Tab: Windows 7's Flip, a flat row of windows (no rotation) with the chosen one in front; release Alt to switch.
# Alt+Shift+Tab goes backwards.
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB
speed = 150ms
view_thumbnail_scale = 0.8
view_thumbnail_rotation = 0

[fast-switcher]
# The switcher plugin owns Alt+Tab; this one (windows raised one after another, no list) stays on Alt+Esc.
activate = <alt> KEY_ESC
activate_backward = <alt> <shift> KEY_ESC

[wm-actions]
# Super+D shows the desktop, as in Windows (the bar's button does the same).
toggle_showdesktop = <super> KEY_D

[scale]
# Super+Tab: all windows side by side. (Super alone is the Start menu, bound in [command].)
toggle = <super> KEY_TAB
duration = 300ms
# All windows side by side, as the web concept's Overview: each window's name on a dark glass label under it,
# the windows that are not pointed at slightly faded.
title_overlay = all
title_position = bottom
title_font_size = 13
bg_color = \#0A1A33B3
text_color = \#FFFFFFFF
inactive_alpha = 0.85
spacing = 40
middle_click_close = true
allow_zoom = false

[move]
# Drag a window to the left or right edge to fill that half, to the top to maximize (as on the web); the preview is
# the web's pale glass.
enable_snap = true
snap_threshold = 12
quarter_snap_threshold = 40
enable_snap_off = true
snap_off_threshold = 20
preview_base_color = \#96C8FF38
preview_base_border = \#FFFFFF99
preview_border_width = 1

[place]
mode = center

[grid]
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
# Super+Up maximizes (the centre slot fills the screen), Super+Down restores; Left/Right fill a half.
slot_c = <super> KEY_UP
restore = <super> KEY_DOWN

[command]
binding_terminal = <ctrl> <alt> KEY_T
command_terminal = foot
binding_lock = <super> KEY_L
command_lock = /usr/share/mwx7/bin/mwx7-lock
# Shell flyouts; mwx7-shellctl writes to the shell's command FIFO.
# Super alone opens Start. A modifier-only binding (wayfire 0.9, bindings.hpp activator_source_t::MODIFIERBINDING) fires
# when Super is RELEASED and only when no other key was pressed meanwhile, so Super+D, Super+E... never open the menu.
binding_start = <super>
command_start = /usr/share/mwx7/bin/mwx7-shellctl start
binding_clipboard = <super> KEY_V
command_clipboard = /usr/share/mwx7/bin/mwx7-shellctl clipboard
binding_search = <super> KEY_S
command_search = /usr/share/mwx7/bin/mwx7-shellctl search
# Keyboard focus into the dock (Super+T) and the bar's tray (Super+B), as Windows' Win+T and Win+B.
binding_dock = <super> KEY_T
command_dock = /usr/share/mwx7/bin/mwx7-shellctl dock
binding_tray = <super> KEY_B
command_tray = /usr/share/mwx7/bin/mwx7-shellctl tray
# Super+E: My Computer. Print: the Snipping Tool (drag a rectangle); Shift+Print the whole screen; Alt+Print the focused window.
binding_computer = <super> KEY_E
command_computer = /usr/share/mwx7/bin/mwx7-app explorer
binding_snip = KEY_PRINT
command_snip = /usr/share/mwx7/snip/mwx7-snip --capture region
binding_snipfull = <shift> KEY_PRINT
command_snipfull = /usr/share/mwx7/snip/mwx7-snip --capture full
binding_snipwin = <alt> KEY_PRINT
command_snipwin = /usr/share/mwx7/snip/mwx7-snip --capture window

[autostart]
autostart_wf_shell = false
background = /usr/share/mwx7/bin/mwx7-wallpaper
shell = /usr/share/mwx7/shell/mwx7-shell
# Desktop icons and widgets, on a layer between the wallpaper and the windows.
desktop = /usr/share/mwx7/desktop/mwx7-desktop-layer
notifications = mako --config /etc/mwx7/mako.conf
idle = /usr/share/mwx7/bin/mwx7-idle
# The concept's startup chime at sign-in.
startup_sound = /usr/share/mwx7/bin/mwx7-sound startup
# Without 3D acceleration, no blur (it was the lag in VMs); it comes back with acceleration.
perf = /usr/share/mwx7/bin/mwx7-perf
# Night light, when it is on in Settings -> Display.
nightlight = /usr/share/mwx7/bin/mwx7-nightlight
# Sticky notes come back at sign-in, as on Windows 7 (only when there are some).
notes = python3 /usr/share/mwx7/apps/stickynotes.py --if-any
# Password prompts for apps that need administrator rights (Settings -> Account, Files).
polkit = /usr/bin/lxpolkit
updates = /usr/share/mwx7/bin/mwx7-update-notify
# When the boot menu went back to the previous version by itself: a notice that offers Settings -> Updates.
bootnotice = /usr/share/mwx7/bin/mwx7-boot-notice
# MWX 7's web apps (Notepad, Paint...) are served to their windows from this PC only (mwx7-app).
webapps = python3 -m http.server 47677 --bind 127.0.0.1 --directory /usr/share/mwx7/web
# The first sign-in of an account: a welcome card and the Welcome tour.
welcome = /usr/share/mwx7/bin/mwx7-welcome
# Highest refresh rate per screen at the current resolution, unless Settings -> Display recorded a choice.
refresh = /usr/share/mwx7/bin/mwx7-refresh
# Portals are D-Bus activated by systemd --user, which must learn the display first or they start blind.
portal = sh -c 'dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP WAYFIRE_SOCKET; exec /usr/libexec/xdg-desktop-portal'

