# MWX 7 notifications: glass cards at the top right, under the status bar.
anchor=top-right
margin=40,12,0,0
width=340
padding=12
border-size=1
border-radius=10
background-color=#E8F0FAC4
text-color=#111111
border-color=#00195099
progress-color=over #9CC8EF
font=Selawik 11
icons=1
max-icon-size=40
default-timeout=6000
# The shell's notification center lists these (makoctl history), so keep more than mako's default of 5.
max-history=50
layer=overlay
# Clicking a card does what it offers (for example "open Settings"); right-click dismisses it.
on-button-left=invoke-default-action
on-button-right=dismiss
# The concept's notification chime (silent when sounds are off in Settings -> Sound).
on-notify=exec /usr/share/mwx7/bin/mwx7-sound notify

# Do Not Disturb (the notification center's switch: makoctl mode -a do-not-disturb): no pop-ups and no chime; the
# notifications still reach the center's list.
[mode=do-not-disturb]
invisible=1
on-notify=none
