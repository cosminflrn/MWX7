# MWX 7's Terminal (foot), system-wide. A person's own ~/.config/foot/foot.ini still wins over this file.
[main]
font=DejaVu Sans Mono:size=11
pad=12x10 center
term=foot
title=Terminal
# Selecting text copies nothing (copy with Ctrl+Shift+C), so it can't silently replace what is on the clipboard.
selection-target=none

[scrollback]
lines=10000

[cursor]
style=beam
blink=no
color=0b1626 7fb8ff

[colors]
alpha=0.96
# Deep Aero navy with the accent blue (#2f86e8) as the bright blue.
background=0b1626
foreground=dbe7f6
selection-background=2f86e8
selection-foreground=ffffff
regular0=1a2740
regular1=e5606a
regular2=5fc98a
regular3=e6c067
regular4=4a98f0
regular5=b48ae8
regular6=4cc6d9
regular7=c3d0e2
bright0=4a5d7a
bright1=ff8088
bright2=86e3a8
bright3=f5da8c
bright4=6db0ff
bright5=cfaeff
bright6=7fe0ee
bright7=f4f8fd
