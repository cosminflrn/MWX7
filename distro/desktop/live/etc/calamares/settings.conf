# MWX 7 installer (Calamares). Everything it needs is already inside the live system, so installing works offline.
---
modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  # Before fstab: fstab writes /etc/crypttab and only names the key file if it already exists.
  - luksbootkeyfile
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - removeuser
  - users
  - networkcfg
  - hwclock
  - mwx7-finish
  - grubcfg
  - bootloader
  - mwx7-boot
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - umount
- show:
  - finished

branding: mwx7
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
