---
# Only removals, so no network is needed: the installed system doesn't carry the live boot tools or this installer.
backend: apt
skip_if_no_internet: false
update_db: false
update_system: false
operations:
  # One list is one apt run; separate entries would rebuild the boot image after each package.
  - remove:
      - live-boot
      - live-boot-initramfs-tools
      - calamares
