---
userGroup:       users
defaultGroups:
    - cdrom
    - sudo
    - audio
    - dip
    - video
    - render
    - input
    - plugdev
    - netdev
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
# No root password: root stays locked, administration goes through sudo.
setRootPassword: false
doReusePassword: false
passwordRequirements:
    nonempty: true
    minLength: 6
user:
    shell: /bin/bash
    forbidden_names: [ root, mwx ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "mwx7-${first}"
