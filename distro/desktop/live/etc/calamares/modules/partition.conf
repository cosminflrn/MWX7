---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
# No swap partition: the installed system swaps to compressed RAM (zram), which also keeps an encrypted disk simple.
userSwapChoices: [ none ]
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
initialSwapChoice: none
# btrfs: checksums, compression and (later) snapshots to roll an update back.
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]
enableLuksAutomatedPartitioning: true
# GRUB opens the encrypted disk itself to read the kernel, and it can only do that for LUKS1.
luksGeneration: luks1
